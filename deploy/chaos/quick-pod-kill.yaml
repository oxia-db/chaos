apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: quick-pod-kill
  namespace: oxia-chaos
spec:
  action: pod-kill
  mode: one
  duration: 10s
  selector:
    namespaces:
      - oxia-chaos
    labelSelectors:
      app.kubernetes.io/name: oxia-cluster
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: oxia-chaos
