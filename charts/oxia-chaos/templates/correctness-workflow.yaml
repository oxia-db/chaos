{{- if .Values.chaosWorkflow.enabled }}
{{- $profile := required "chaosWorkflow.profile is required" .Values.chaosWorkflow.profile -}}
{{- if not (has $profile (list "quick" "six-hour" "six-hour-periodic" "pipeline")) -}}
{{- fail (printf "unsupported chaosWorkflow.profile %q" $profile) -}}
{{- end }}
{{- $killContainer := .Values.chaosWorkflow.periodicPodKill.container | default "" -}}
{{- if not (has $killContainer (list "" "server" "coordinator")) -}}
{{- fail (printf "unsupported chaosWorkflow.periodicPodKill.container %q" $killContainer) -}}
{{- end }}
{{- $killInterval := .Values.chaosWorkflow.periodicPodKill.interval -}}
{{- $killIntervalSeconds := include "oxia-chaos.durationSeconds" (dict "value" $killInterval "field" "chaosWorkflow.periodicPodKill.interval") | atoi -}}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: {{ printf "%s-%s-correctness-r%d" (include "oxia-chaos.fullname" .) $profile .Release.Revision | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "oxia-chaos.labels" . | nindent 4 }}
    app.kubernetes.io/component: correctness
    app.kubernetes.io/part-of: oxia-chaos
    helm.sh/revision: {{ .Release.Revision | quote }}
    oxia.chaos/channel: {{ required "channel is required" .Values.channel | quote }}
    oxia.chaos/profile: {{ $profile | quote }}
spec:
{{- if eq $profile "quick" }}
  entry: quick-pipeline
  templates:
    - name: quick-pipeline
      templateType: Serial
      children:
        - quick-baseline
        - pod-kill
        - quick-recovery
        - health-check
        - quick-observation
    - name: quick-baseline
      templateType: Suspend
      deadline: 20s
    - name: pod-kill
      templateType: PodChaos
      deadline: 10s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          {{- include "oxia-chaos.serverSelector" . | nindent 10 }}
    - name: quick-recovery
      templateType: Suspend
      deadline: 20s
    {{- include "oxia-chaos.healthCheckTemplate" (dict "root" . "name" "health-check") | nindent 4 }}
    - name: quick-observation
      templateType: Suspend
      deadline: 10s
{{- else if eq $profile "six-hour-periodic" }}
  entry: six-hour-periodic-pipeline
  templates:
    - name: six-hour-periodic-pipeline
      templateType: Serial
      children:
        - baseline
        - periodic-pod-kill
        - recovery
        - health-check
    - name: baseline
      templateType: Suspend
      deadline: 5m
    - name: periodic-pod-kill
      templateType: Serial
      # Together with the baseline and recovery, keep the workflow aligned
      # with the six-hour basic-kv workload. The deadline ends the rounds.
      deadline: 5h30m
      children:
        # Each round takes at least the interval, so this many rounds outlast the deadline.
        {{- range until (add (div 19800 $killIntervalSeconds) 1 | int) }}
        - periodic-pod-kill-round
        {{- end }}
    - name: periodic-pod-kill-round
      templateType: Serial
      # Wait until every server is back before the next kill, so that a run keeps at most one
      # server down. A killed container restarts in place, under the kubelet's restart back-off,
      # which grows to 5 minutes when the container is killed again within 10 minutes of its start.
      children:
        - periodic-pod-kill-once
        - health-check
        - periodic-pod-kill-interval
    - name: periodic-pod-kill-once
      templateType: PodChaos
      deadline: 10s
      podChaos:
        {{- if $killContainer }}
        action: container-kill
        containerNames:
          - {{ $killContainer | quote }}
        {{- else }}
        action: pod-kill
        {{- end }}
        mode: one
        selector:
          {{- include "oxia-chaos.serverSelector" . | nindent 10 }}
    - name: periodic-pod-kill-interval
      templateType: Suspend
      deadline: {{ $killInterval | quote }}
    - name: recovery
      templateType: Suspend
      deadline: 5m
    {{- include "oxia-chaos.healthCheckTemplate" (dict "root" . "name" "health-check") | nindent 4 }}
{{- else if eq $profile "pipeline" }}
{{- $pipeline := .Values.chaosWorkflow.pipeline }}
{{- $stages := required "chaosWorkflow.pipeline.stages is required" $pipeline.stages }}
{{- $baseline := include "oxia-chaos.durationSeconds" (dict "value" $pipeline.baseline "field" "chaosWorkflow.pipeline.baseline") | atoi }}
{{- $recovery := include "oxia-chaos.durationSeconds" (dict "value" $pipeline.recovery "field" "chaosWorkflow.pipeline.recovery") | atoi }}
{{- $total := $baseline }}
{{- $names := list }}
{{- range $stage := $stages }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,28}[a-z0-9])?$" (toString $stage.name)) }}
{{- fail (printf "chaosWorkflow.pipeline.stages name must be a DNS label of at most 30 characters, got %q" (toString $stage.name)) }}
{{- end }}
{{- if has $stage.name $names }}
{{- fail (printf "chaosWorkflow.pipeline.stages has two stages named %q" $stage.name) }}
{{- end }}
{{- $names = append $names $stage.name }}
{{- $field := printf "chaosWorkflow.pipeline.stages[%s]" $stage.name }}
{{- $duration := include "oxia-chaos.durationSeconds" (dict "value" $stage.duration "field" (printf "%s.duration" $field)) | atoi }}
{{- $_ := include "oxia-chaos.durationSeconds" (dict "value" $stage.interval "field" (printf "%s.interval" $field)) }}
{{- $total = add $total $duration $recovery }}
{{- end }}
{{- range $caseName, $case := .Values.cases }}
{{- if and $case.enabled (not $.Values.runnerJob.continuous) }}
{{- $caseDuration := include "oxia-chaos.durationSeconds" (dict "value" (index $case.profiles $.Values.testProfile).duration "field" (printf "cases.%s.profiles.%s.duration" $caseName $.Values.testProfile)) | atoi }}
{{- if gt $total $caseDuration }}
{{- fail (printf "chaosWorkflow.pipeline lasts %ds, longer than the %ds of case %s: the last stages would run without a workload" $total $caseDuration $caseName) }}
{{- end }}
{{- end }}
{{- end }}
  entry: pipeline
  templates:
    - name: pipeline
      templateType: Serial
      children:
        - baseline
        {{- range $stage := $stages }}
        - {{ $stage.name }}
        - {{ $stage.name }}-recovery
        - {{ $stage.name }}-health-check
        {{- end }}
    - name: baseline
      templateType: Suspend
      deadline: {{ $pipeline.baseline | quote }}
    {{- range $stage := $stages }}
    {{- $duration := include "oxia-chaos.durationSeconds" (dict "value" $stage.duration "field" "") | atoi }}
    {{- $interval := include "oxia-chaos.durationSeconds" (dict "value" $stage.interval "field" "") | atoi }}
    - name: {{ $stage.name }}
      templateType: Serial
      # The deadline ends the stage. Each round takes at least the interval, so this many rounds
      # outlast the deadline.
      deadline: {{ $stage.duration | quote }}
      children:
        {{- range until (add (div $duration $interval) 1 | int) }}
        - {{ $stage.name }}-round
        {{- end }}
    - name: {{ $stage.name }}-round
      templateType: Serial
      # Wait until every server is back before the next fault, so that a stage keeps at most one
      # server down.
      children:
        - {{ $stage.name }}-fault
        - {{ $stage.name }}-health-check
        - {{ $stage.name }}-interval
    - name: {{ $stage.name }}-fault
      {{- include "oxia-chaos.stageFault" (dict "root" $ "stage" $stage) | trim | nindent 6 }}
    - name: {{ $stage.name }}-interval
      templateType: Suspend
      deadline: {{ $stage.interval | quote }}
    - name: {{ $stage.name }}-recovery
      templateType: Suspend
      deadline: {{ $pipeline.recovery | quote }}
    {{- include "oxia-chaos.healthCheckTemplate" (dict "root" $ "name" (printf "%s-health-check" $stage.name)) | nindent 4 }}
    {{- end }}
{{- else }}
  entry: six-hour-pipeline
  templates:
    - name: six-hour-pipeline
      templateType: Serial
      children:
        - baseline
        - pod-kill
        - recovery
        - health-check
        - observation
    - name: baseline
      templateType: Suspend
      deadline: 10m
    - name: pod-kill
      templateType: PodChaos
      deadline: 10s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          {{- include "oxia-chaos.serverSelector" . | nindent 10 }}
    - name: recovery
      templateType: Suspend
      deadline: 10m
    {{- include "oxia-chaos.healthCheckTemplate" (dict "root" . "name" "health-check") | nindent 4 }}
    - name: observation
      templateType: Suspend
      # Together with the baseline, fault, and recovery, keep the workflow aligned
      # with the six-hour basic-kv workload.
      deadline: 5h39m
{{- end }}
{{- end }}
