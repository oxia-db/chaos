nameOverride: ""
fullnameOverride: ""

# Leave empty to use the chart-managed Oxia service in the release namespace.
serviceAddress: ""

runners:
  java:
    enabled: true
    image:
      repository: oxia/chaos-java
      tag: latest
      pullPolicy: IfNotPresent
    env: []
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi

cases:
  basic-kv:
    duration: 6h
    keyCount: 10000
    rate: 258
    batchSize: 100
    checkpointInterval: 1m

runnerJob:
  imagePullSecrets: []
  annotations: {}
  labels: {}
  activeDeadlineSeconds: 25200
  metrics:
    enabled: true
    port: 9464
    path: /metrics
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

oxia-cluster:
  enabled: true
  # Add oc-<runner>-<case> for every enabled pair.
  namespaces:
    - name: oc-java-basic-kv
      initialShardCount: 1
      replicationFactor: 3
  image:
    repository: oxia/oxia
    tag: 0.16.8
    pullPolicy: IfNotPresent
  server:
    replicas: 3
    cpu: 250m
    memory: 512Mi
    storage: 1Gi
    config:
      storage:
        database:
          readCacheSizeMB: 64

chaos-mesh:
  enabled: true
  controllerManager:
    leaderElection:
      enabled: false
  chaosDaemon:
    runtime: containerd
    socketPath: /run/containerd/containerd.sock
  dashboard:
    create: false
