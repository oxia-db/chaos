{{- if .Values.chaosWorkflow.enabled }}
{{- $profile := required "chaosWorkflow.profile is required" .Values.chaosWorkflow.profile -}}
{{- if not (has $profile (list "quick" "six-hour" "six-hour-periodic")) -}}
{{- fail (printf "unsupported chaosWorkflow.profile %q" $profile) -}}
{{- end }}
{{- $killContainer := .Values.chaosWorkflow.periodicPodKill.container | default "" -}}
{{- if not (has $killContainer (list "" "server" "coordinator")) -}}
{{- fail (printf "unsupported chaosWorkflow.periodicPodKill.container %q" $killContainer) -}}
{{- end }}
{{- $killInterval := required "chaosWorkflow.periodicPodKill.interval is required" .Values.chaosWorkflow.periodicPodKill.interval -}}
{{- if not (regexMatch "^([0-9]+[hms])+$" $killInterval) -}}
{{- fail (printf "unsupported chaosWorkflow.periodicPodKill.interval %q, use hours, minutes and seconds such as 2m or 1m30s" $killInterval) -}}
{{- end }}
{{- $killIntervalSeconds := 0 -}}
{{- range regexFindAll "[0-9]+[hms]" $killInterval -1 }}
{{- $unitSeconds := get (dict "h" 3600 "m" 60 "s" 1) (regexReplaceAll "[0-9]" . "") -}}
{{- $killIntervalSeconds = add $killIntervalSeconds (mul (regexReplaceAll "[hms]" . "") $unitSeconds) -}}
{{- end }}
{{- if lt (int $killIntervalSeconds) 1 -}}
{{- fail "chaosWorkflow.periodicPodKill.interval must be positive" -}}
{{- end }}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: {{ printf "%s-%s-correctness-r%d" (include "oxia-chaos.fullname" .) $profile .Release.Revision | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "oxia-chaos.labels" . | nindent 4 }}
    app.kubernetes.io/component: correctness
    app.kubernetes.io/part-of: oxia-chaos
    oxia.chaos/channel: {{ required "channel is required" .Values.channel | quote }}
    oxia.chaos/profile: {{ $profile | quote }}
spec:
{{- if eq $profile "quick" }}
  entry: quick-pipeline
  templates:
    - name: quick-pipeline
      templateType: Serial
      children:
        - quick-baseline
        - pod-kill
        - quick-recovery
        - health-check
        - quick-observation
    - name: quick-baseline
      templateType: Suspend
      deadline: 20s
    - name: pod-kill
      templateType: PodChaos
      deadline: 10s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - {{ .Release.Namespace | quote }}
          labelSelectors:
            app.kubernetes.io/name: oxia-cluster
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
    - name: quick-recovery
      templateType: Suspend
      deadline: 20s
    - name: health-check
      templateType: Task
      task:
        container:
          name: oxia-health
          image: {{ printf "%s:%s" (index .Values "oxia-cluster").image.repository (index .Values "oxia-cluster").image.tag | quote }}
          imagePullPolicy: {{ (index .Values "oxia-cluster").image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - for ordinal in 0 1 2; do until oxia health --host={{ .Release.Name }}-$ordinal.{{ .Release.Name }}-svc --port=6649; do sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    - name: quick-observation
      templateType: Suspend
      deadline: 10s
{{- else if eq $profile "six-hour-periodic" }}
  entry: six-hour-periodic-pipeline
  templates:
    - name: six-hour-periodic-pipeline
      templateType: Serial
      children:
        - baseline
        - periodic-pod-kill
        - recovery
        - health-check
    - name: baseline
      templateType: Suspend
      deadline: 5m
    - name: periodic-pod-kill
      templateType: Serial
      # Together with the baseline and recovery, keep the workflow aligned
      # with the six-hour basic-kv workload. The deadline ends the rounds.
      deadline: 5h30m
      children:
        # Each round takes at least the interval, so this many rounds outlast the deadline.
        {{- range until (add (div 19800 $killIntervalSeconds) 1 | int) }}
        - periodic-pod-kill-round
        {{- end }}
    - name: periodic-pod-kill-round
      templateType: Serial
      # Wait until every server is back before the next kill, so that a run keeps at most one
      # server down. A killed container restarts in place, under the kubelet's restart back-off,
      # which grows to 5 minutes when the container is killed again within 10 minutes of its start.
      children:
        - periodic-pod-kill-once
        - health-check
        - periodic-pod-kill-interval
    - name: periodic-pod-kill-once
      templateType: PodChaos
      deadline: 10s
      podChaos:
        {{- if $killContainer }}
        action: container-kill
        containerNames:
          - {{ $killContainer | quote }}
        {{- else }}
        action: pod-kill
        {{- end }}
        mode: one
        selector:
          namespaces:
            - {{ .Release.Namespace | quote }}
          labelSelectors:
            app.kubernetes.io/name: oxia-cluster
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
    - name: periodic-pod-kill-interval
      templateType: Suspend
      deadline: {{ $killInterval | quote }}
    - name: recovery
      templateType: Suspend
      deadline: 5m
    - name: health-check
      templateType: Task
      task:
        container:
          name: oxia-health
          image: {{ printf "%s:%s" (index .Values "oxia-cluster").image.repository (index .Values "oxia-cluster").image.tag | quote }}
          imagePullPolicy: {{ (index .Values "oxia-cluster").image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - for ordinal in 0 1 2; do until oxia health --host={{ .Release.Name }}-$ordinal.{{ .Release.Name }}-svc --port=6649; do sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
{{- else }}
  entry: six-hour-pipeline
  templates:
    - name: six-hour-pipeline
      templateType: Serial
      children:
        - baseline
        - pod-kill
        - recovery
        - health-check
        - observation
    - name: baseline
      templateType: Suspend
      deadline: 10m
    - name: pod-kill
      templateType: PodChaos
      deadline: 10s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - {{ .Release.Namespace | quote }}
          labelSelectors:
            app.kubernetes.io/name: oxia-cluster
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
    - name: recovery
      templateType: Suspend
      deadline: 10m
    - name: health-check
      templateType: Task
      task:
        container:
          name: oxia-health
          image: {{ printf "%s:%s" (index .Values "oxia-cluster").image.repository (index .Values "oxia-cluster").image.tag | quote }}
          imagePullPolicy: {{ (index .Values "oxia-cluster").image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - for ordinal in 0 1 2; do until oxia health --host={{ .Release.Name }}-$ordinal.{{ .Release.Name }}-svc --port=6649; do sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    - name: observation
      templateType: Suspend
      # Together with the baseline, fault, and recovery, keep the workflow aligned
      # with the six-hour basic-kv workload.
      deadline: 5h39m
{{- end }}
{{- end }}
