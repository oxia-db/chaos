name: Stability Status

on:
  workflow_run:
    workflows:
      - Correctness
    types:
      - completed
  workflow_dispatch:
    inputs:
      mode:
        description: Initialize empty history or replay a scheduled run
        required: true
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - replay
      source_run_id:
        description: Completed scheduled Correctness run ID (replay only)
        required: false
        type: string

concurrency:
  group: stability-status-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-status:
    name: Merge stability history
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out publisher tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Resolve source correctness run
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'bootstrap' }}
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          test -n "$REQUESTED_RUN_ID"
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REQUESTED_RUN_ID")
          test "$(jq -r '.name' <<< "$run_json")" = "Correctness"
          test "$(jq -r '.status' <<< "$run_json")" = "completed"
          test "$(jq -r '.event' <<< "$run_json")" = "schedule"
          {
            echo "run_id=$REQUESTED_RUN_ID"
            echo "run_date=$(jq -r '.created_at[0:10]' <<< "$run_json")"
            echo "run_url=$(jq -r '.html_url' <<< "$run_json")"
          } >> "$GITHUB_OUTPUT"

      - name: Download normalized testcase results
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'bootstrap' }}
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: status-result-*
          path: status-results
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Prepare status-data worktree
        run: |
          if git fetch origin refs/heads/status-data:refs/remotes/origin/status-data; then
            git worktree add --detach status-data refs/remotes/origin/status-data
          else
            git worktree add --detach status-data HEAD
            git -C status-data switch --orphan status-data
          fi

      - name: Merge and validate 90-day status document
        env:
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap' }}
          RUN_DATE: ${{ steps.source.outputs.run_date }}
          RUN_URL: ${{ steps.source.outputs.run_url }}
        run: |
          expected_results=()
          if [ "$BOOTSTRAP" != "true" ]; then
            while IFS= read -r expected_result; do
              expected_results+=(--expected-result "$expected_result")
            done < <(jq --raw-output \
              'to_entries[] | [.key, .value.serverVersion, "basic-kv"] | join(",")' \
              config/oxia-channels.json)
          fi
          python3 scripts/status/status.py merge \
            --existing status-data/status/v1/summary.json \
            --results status-results \
            --output status-data/status/v1/summary.json \
            --fallback-date "${RUN_DATE:-$(date -u +%F)}" \
            --fallback-run-url "${RUN_URL:-https://github.com/$GITHUB_REPOSITORY/actions}" \
            "${expected_results[@]}"
          python3 scripts/status/status.py validate status-data/status/v1/summary.json

      - name: Persist generated history
        run: |
          git -C status-data config user.name github-actions[bot]
          git -C status-data config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C status-data add status/v1/summary.json
          if ! git -C status-data diff --cached --quiet; then
            git -C status-data commit -m "chore: update stability status"
            git -C status-data push origin HEAD:status-data
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/status/v1
          cp status-data/status/v1/summary.json pages/status/v1/summary.json
          touch pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          include-hidden-files: true

  smoke-status:
    name: Validate status integration
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Detect status smoke artifacts
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_count=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            --jq '[.artifacts[].name | select(startswith("status-smoke-result-"))] | length')
          if [ "$artifact_count" -eq 1 ]; then
            echo "has_results=true" >> "$GITHUB_OUTPUT"
          elif [ "$artifact_count" -eq 0 ]; then
            echo "has_results=false" >> "$GITHUB_OUTPUT"
          else
            echo "Expected zero or one status smoke artifact, found $artifact_count" >&2
            exit 1
          fi

      - name: Check out publisher tooling
        if: ${{ steps.detect.outputs.has_results == 'true' }}
        uses: actions/checkout@v7

      - name: Download normalized smoke results
        if: ${{ steps.detect.outputs.has_results == 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: status-smoke-result-*
          path: status-smoke-results
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Merge and validate smoke status document
        if: ${{ steps.detect.outputs.has_results == 'true' }}
        env:
          RUN_DATE: ${{ github.event.workflow_run.created_at }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          expected_results=()
          while IFS= read -r expected_result; do
            expected_results+=(--expected-result "$expected_result")
          done < <(jq --raw-output \
            'to_entries[] | [.key, .value.serverVersion, "basic-kv"] | join(",")' \
            config/oxia-channels.json)
          python3 scripts/status/status.py merge \
            --existing status-smoke/missing-summary.json \
            --results status-smoke-results \
            --output status-smoke/status/v1/summary.json \
            --fallback-date "${RUN_DATE:0:10}" \
            --fallback-run-url "$RUN_URL" \
            "${expected_results[@]}"
          python3 scripts/status/status.py validate status-smoke/status/v1/summary.json
          touch status-smoke/.nojekyll

      - name: Package smoke Pages artifact
        if: ${{ steps.detect.outputs.has_results == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: status-smoke-pages-${{ github.event.workflow_run.id }}
          path: status-smoke
          retention-days: 7
          include-hidden-files: true

  deploy-status:
    name: Deploy stability status
    if: ${{ needs.publish-status.result == 'success' }}
    needs:
      - publish-status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
