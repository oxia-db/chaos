{{- if .Values.chaosWorkflow.enabled }}
{{- $profile := required "chaosWorkflow.profile is required" .Values.chaosWorkflow.profile -}}
{{- if not (has $profile (list "quick" "six-hour")) -}}
{{- fail (printf "unsupported chaosWorkflow.profile %q" $profile) -}}
{{- end }}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: {{ printf "%s-%s-correctness-r%d" (include "oxia-chaos.fullname" .) $profile .Release.Revision | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "oxia-chaos.labels" . | nindent 4 }}
    app.kubernetes.io/component: correctness
    app.kubernetes.io/part-of: oxia-chaos
    oxia.chaos/channel: {{ required "channel is required" .Values.channel | quote }}
    oxia.chaos/profile: {{ $profile | quote }}
spec:
{{- if eq $profile "quick" }}
  entry: quick-pipeline
  templates:
    - name: quick-pipeline
      templateType: Serial
      children:
        - quick-baseline
        - pod-kill
        - quick-recovery
        - health-check
        - quick-observation
    - name: quick-baseline
      templateType: Suspend
      deadline: 20s
    - name: pod-kill
      templateType: PodChaos
      deadline: 10s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - {{ .Release.Namespace | quote }}
          labelSelectors:
            app.kubernetes.io/name: oxia-cluster
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
    - name: quick-recovery
      templateType: Suspend
      deadline: 20s
    - name: health-check
      templateType: Task
      task:
        container:
          name: oxia-health
          image: {{ printf "%s:%s" (index .Values "oxia-cluster").image.repository (index .Values "oxia-cluster").image.tag | quote }}
          imagePullPolicy: {{ (index .Values "oxia-cluster").image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - for ordinal in 0 1 2; do until oxia health --host={{ .Release.Name }}-$ordinal.{{ .Release.Name }}-svc --port=6649; do sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    - name: quick-observation
      templateType: Suspend
      deadline: 10s
{{- else }}
  entry: six-hour-pipeline
  templates:
    - name: six-hour-pipeline
      templateType: Serial
      children:
        - baseline
        - pod-kill
        - recovery
        - health-check
        - observation
    - name: baseline
      templateType: Suspend
      deadline: 10m
    - name: pod-kill
      templateType: PodChaos
      deadline: 10s
      podChaos:
        action: pod-kill
        mode: one
        selector:
          namespaces:
            - {{ .Release.Namespace | quote }}
          labelSelectors:
            app.kubernetes.io/name: oxia-cluster
            app.kubernetes.io/component: server
            app.kubernetes.io/instance: {{ .Release.Name | quote }}
    - name: recovery
      templateType: Suspend
      deadline: 10m
    - name: health-check
      templateType: Task
      task:
        container:
          name: oxia-health
          image: {{ printf "%s:%s" (index .Values "oxia-cluster").image.repository (index .Values "oxia-cluster").image.tag | quote }}
          imagePullPolicy: {{ (index .Values "oxia-cluster").image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - for ordinal in 0 1 2; do until oxia health --host={{ .Release.Name }}-$ordinal.{{ .Release.Name }}-svc --port=6649; do sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
    - name: observation
      templateType: Suspend
      # Together with the baseline, fault, and recovery, keep the workflow aligned
      # with the six-hour basic-kv workload.
      deadline: 5h39m
{{- end }}
{{- end }}
