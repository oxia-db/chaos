nameOverride: ""
fullnameOverride: ""

# Identifies the Oxia server channel exercised by this chart release.
channel: stable

# Selects one configuration from each enabled testcase.
testProfile: six-hour

# Deployment orchestration disables every runner while Oxia clusters converge.
runnerWorkloadsEnabled: true
runnerImagePullPolicyOverride: ""

# Leave empty to use the chart-managed Oxia service in the release namespace.
serviceAddress: ""

runners:
  java:
    enabled: true
    image:
      repository: oxia/chaos-java
      tag: latest
      pullPolicy: Always
    env: []
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi

cases:
  basic-kv:
    enabled: true
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      six-hour:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m
  # Ephemeral records owned by crashing and closing owner processes.
  ephemeral:
    enabled: true
    # Replaces the runner resources: two owner JVMs (-Xmx128m each) run beside the runner.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      six-hour:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m
  # Secondary index entries that must follow their records through updates and deletes.
  secondary-index:
    enabled: true
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      six-hour:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m
  # Sequence keys assigned by the server and the sequence updates that follow them.
  sequences:
    enabled: true
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      six-hour:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m
  # Notifications checked against the writes that caused them.
  notification:
    enabled: true
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      six-hour:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m
  # Conditional writes racing on record versions.
  versioning:
    enabled: true
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      six-hour:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m

chaosWorkflow:
  enabled: false
  # Repeat the workflow without end: a Chaos Mesh Schedule starts it again within a minute once the
  # previous one is accomplished, and never runs two at once. Use it with runnerJob.continuous.
  repeat: false
  # Supported profiles: quick, six-hour, six-hour-periodic, pipeline.
  profile: six-hour
  periodicPodKill:
    # Time between pod kills for the six-hour-periodic profile, in hours, minutes and seconds such as
    # 2m or 1m30s. It starts once every server is healthy again, so a run never kills a second server
    # while the first is still down.
    interval: 5m
    # Kill only this container of the pod, server or coordinator, which restarts in place while the
    # other container keeps running. Empty kills the whole pod. A container restarts under the kubelet's
    # restart back-off, which grows up to 5 minutes until the container has run for 10 minutes, so the
    # kills space out as the back-off grows.
    container: ""
  # Stages of the pipeline profile, run in order. For its duration, a stage repeats rounds of one
  # fault, a wait until every server is healthy and the interval, so it keeps at most one server
  # down. After each stage, the workflow waits for the recovery period and for every server to be
  # healthy. The baseline, stages and recoveries must fit in the duration of every enabled case.
  # Durations use h, m and s, such as 2h40m.
  pipeline:
    baseline: 5m
    recovery: 5m
    stages:
      # Delete and recreate one server pod.
      - name: pod-kill
        fault: pod-kill
        duration: 2h40m
        interval: 5m
      # Kill the container in one server pod, which restarts in place. container is server or
      # coordinator.
      - name: server-kill
        fault: container-kill
        container: server
        duration: 2h40m
        interval: 5m
      # Another fault is network-partition: it cuts one server pod off the network, from the other
      # servers, the clients, the Kubernetes API and DNS, for the partition duration, then heals it.
      # The loopback stays up, so the pod keeps passing its probes and isn't restarted.
      # - name: network-partition
      #   fault: network-partition
      #   partition: 1m
      #   duration: 2h40m
      #   interval: 5m

runnerJob:
  imagePullSecrets: []
  annotations: {}
  labels: {}
  activeDeadlineSeconds: 25200
  # Run every case without end in a StatefulSet of one pod, instead of a Job that ends after the
  # profile's duration. The runner then checks every checkpoint until it's stopped, and stays up
  # after a correctness violation. The profile's duration and activeDeadlineSeconds don't apply.
  continuous: false
  metrics:
    enabled: true
    port: 9464
    path: /metrics
  telemetry:
    enabled: false
    otlpEndpoint: ""
    clusterName: oxia-chaos
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Before each upgrade, delete this release's correctness workflows from earlier revisions, including
# ones applied outside Helm, with their nodes and health-check pods. Runs only where the Chaos Mesh
# Workflow API is installed.
workflowCleanup:
  enabled: true
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.36.5
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

observability:
  enabled: false
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.153.0
    pullPolicy: IfNotPresent
  existingSecret: ""
  clusterName: oxia-chaos
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  traces:
    successSamplingPercentage: 0.5

oxia-cluster:
  enabled: true
  # Add oc-<runner>-<case> for every enabled pair.
  namespaces:
    - name: oc-java-basic-kv
      initialShardCount: 3
      replicationFactor: 3
    - name: oc-java-ephemeral
      initialShardCount: 3
      replicationFactor: 3
    - name: oc-java-secondary-index
      initialShardCount: 3
      replicationFactor: 3
    - name: oc-java-sequences
      initialShardCount: 3
      replicationFactor: 3
    - name: oc-java-notification
      initialShardCount: 3
      replicationFactor: 3
    - name: oc-java-versioning
      initialShardCount: 3
      replicationFactor: 3
  image:
    repository: oxia/oxia
    tag: 0.16.8
    pullPolicy: IfNotPresent
  server:
    replicas: 3
    cpu: 250m
    memory: 512Mi
    storage: 1Gi
    config:
      storage:
        database:
          readCacheSizeMB: 64

chaos-mesh:
  enabled: true
  controllerManager:
    leaderElection:
      enabled: false
  chaosDaemon:
    runtime: containerd
    socketPath: /run/containerd/containerd.sock
  dashboard:
    create: false
