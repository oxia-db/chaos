{{- $root := . -}}
{{- range $runnerName, $runner := .Values.runners -}}
{{- if and $root.Values.runnerWorkloadsEnabled $runner.enabled -}}
{{- range $caseName, $case := $root.Values.cases }}
{{- if $case.enabled -}}
{{- $caseProfile := required (printf "cases.%s.profiles.%s is required" $caseName $root.Values.testProfile) (index $case.profiles $root.Values.testProfile) }}
{{- $continuous := $root.Values.runnerJob.continuous }}
---
{{- if $continuous }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-%s-%s" (include "oxia-chaos.fullname" $root) $runnerName $caseName | trunc 63 | trimSuffix "-" }}
{{- else }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s-%s-r%d" (include "oxia-chaos.fullname" $root) $runnerName $caseName $root.Release.Revision | trunc 63 | trimSuffix "-" }}
{{- end }}
  labels:
    {{- include "oxia-chaos.labels" $root | nindent 4 }}
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: oxia-chaos
    helm.sh/revision: {{ $root.Release.Revision | quote }}
    oxia.chaos/channel: {{ required "channel is required" $root.Values.channel | quote }}
    oxia.chaos/runner: {{ $runnerName | quote }}
    oxia.chaos/case: {{ $caseName | quote }}
spec:
  {{- if $continuous }}
  # One pod at a time, so a case never has two writers in its namespace
  replicas: 1
  serviceName: ""
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name | quote }}
      app.kubernetes.io/component: runner
      oxia.chaos/runner: {{ $runnerName | quote }}
      oxia.chaos/case: {{ $caseName | quote }}
  {{- else }}
  backoffLimit: 0
  activeDeadlineSeconds: {{ $root.Values.runnerJob.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "oxia-chaos.labels" $root | nindent 8 }}
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: oxia-chaos
        {{- if not $continuous }}
        helm.sh/revision: {{ $root.Release.Revision | quote }}
        {{- end }}
        oxia.chaos/channel: {{ required "channel is required" $root.Values.channel | quote }}
        oxia.chaos/runner: {{ $runnerName | quote }}
        oxia.chaos/case: {{ $caseName | quote }}
        {{- with $root.Values.runnerJob.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or $root.Values.runnerJob.metrics.enabled $root.Values.runnerJob.annotations }}
      annotations:
        {{- if $root.Values.runnerJob.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $root.Values.runnerJob.metrics.port | quote }}
        prometheus.io/path: {{ $root.Values.runnerJob.metrics.path | quote }}
        {{- end }}
        {{- with $root.Values.runnerJob.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      restartPolicy: {{ ternary "Always" "Never" $continuous }}
      serviceAccountName: {{ include "oxia-chaos.serviceAccountName" $root }}
      {{- with $root.Values.runnerJob.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if (index $root.Values "oxia-cluster").enabled }}
      initContainers:
        - name: wait-for-oxia
          image: "{{ (index $root.Values "oxia-cluster").image.repository }}:{{ (index $root.Values "oxia-cluster").image.tag }}"
          imagePullPolicy: {{ (index $root.Values "oxia-cluster").image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - until oxia health --host={{ $root.Release.Name }} --port=6649; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      {{- end }}
      containers:
        - name: runner
          image: "{{ required (printf "runners.%s.image.repository is required" $runnerName) $runner.image.repository }}:{{ required (printf "runners.%s.image.tag is required" $runnerName) $runner.image.tag }}"
          imagePullPolicy: {{ default (default "IfNotPresent" $runner.image.pullPolicy) $root.Values.runnerImagePullPolicyOverride }}
          args:
            - {{ printf "--case=%s" $caseName | quote }}
            - {{ printf "--service-address=%s" (include "oxia-chaos.serviceAddress" $root) | quote }}
            - {{ printf "--duration=%s" (ternary "infinite" $caseProfile.duration $continuous) | quote }}
            - {{ printf "--key-count=%v" $caseProfile.keyCount | quote }}
            - {{ printf "--rate=%v" $caseProfile.rate | quote }}
            - {{ printf "--batch-size=%v" $caseProfile.batchSize | quote }}
            - {{ printf "--checkpoint-interval=%s" $caseProfile.checkpointInterval | quote }}
          {{- if or $root.Values.runnerJob.metrics.enabled $root.Values.runnerJob.telemetry.enabled $runner.env }}
          env:
            {{- if $root.Values.runnerJob.metrics.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "oxia-chaos-%s-%s-%s" $root.Values.channel $runnerName $caseName | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: prometheus
            - name: OTEL_EXPORTER_PROMETHEUS_HOST
              value: 0.0.0.0
            - name: OTEL_EXPORTER_PROMETHEUS_PORT
              value: {{ $root.Values.runnerJob.metrics.port | quote }}
            {{- end }}
            {{- if $root.Values.runnerJob.telemetry.enabled }}
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "runnerJob.telemetry.otlpEndpoint is required when telemetry is enabled" $root.Values.runnerJob.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "k8s.cluster.name=%s,deployment.environment.name=github-actions,oxia.chaos.channel=%s,oxia.chaos.case=%s,oxia.chaos.runner=%s" $root.Values.runnerJob.telemetry.clusterName $root.Values.channel $caseName $runnerName | quote }}
            {{- end }}
            {{- with $runner.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $root.Values.runnerJob.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ $root.Values.runnerJob.metrics.port }}
              protocol: TCP
          {{- end }}
          resources:
            {{- toYaml (default (default dict $runner.resources) $case.resources) | nindent 12 }}
      {{- with $root.Values.runnerJob.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.runnerJob.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.runnerJob.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
