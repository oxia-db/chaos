name: Correctness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-correctness.yaml"
      - "charts/**"
      - "config/**"
      - "deploy/**"
      - "runner-java/**"
      - "observability/**"
      - "scripts/observability/**"
      - "scripts/status/**"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-correctness.yaml"
      - "charts/**"
      - "config/**"
      - "deploy/**"
      - "runner-java/**"
      - "observability/**"
      - "scripts/observability/**"
      - "scripts/status/**"
      - "Makefile"
  schedule:
    # Oxia refreshes the nightly Stable and Beta images at 18:00 UTC.
    # Use an off-peak minute so GitHub does not delay a top-of-hour cron.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Correctness pipeline profile
        required: true
        type: choice
        default: quick
        options: [quick, status-smoke, five-cycle]

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 'five-cycle' || inputs.profile == 'status-smoke' && 'status-smoke' || 'quick' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLUSTER_NAME: oxia-chaos
  KUBE_CONTEXT: kind-oxia-chaos
  NAMESPACE: oxia-chaos
  RELEASE_NAME: oxia-chaos
  CHANNELS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle' || inputs.profile == 'status-smoke') && 'stable beta' || 'stable' }}
  WORKLOAD_PROFILE: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 'five-cycle' || 'quick' }}
  RUNNER_TIMEOUT_SECONDS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '23400' || '600' }}
  WORKFLOW_TIMEOUT_SECONDS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '21600' || '240' }}
  EXPECTED_CHAOS_INJECTIONS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '30' || '1' }}
  OBSERVABILITY_ENABLED: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT != '' && secrets.GRAFANA_CLOUD_OTLP_INSTANCE_ID != '' && secrets.GRAFANA_CLOUD_TOKEN != '' && 'true' || 'false' }}
  GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
  GRAFANA_CLOUD_OTLP_INSTANCE_ID: ${{ secrets.GRAFANA_CLOUD_OTLP_INSTANCE_ID }}
  GRAFANA_CLOUD_TOKEN: ${{ secrets.GRAFANA_CLOUD_TOKEN }}
  GRAFANA_CLOUD_GRAFANA_URL: ${{ vars.GRAFANA_CLOUD_GRAFANA_URL }}
  GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_CLOUD_SERVICE_ACCOUNT_TOKEN }}

jobs:
  correctness:
    name: Helm correctness ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 'five-cycle' || inputs.profile == 'status-smoke' && 'status-smoke' || 'quick' }}
    runs-on: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle' || inputs.profile == 'status-smoke') && 'cncf-ubuntu-8-32-x86' || 'ubuntu-latest' }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 420 || inputs.profile == 'status-smoke' && 45 || 25 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: azure/setup-helm@v5

      - name: Verify repository
        id: verify
        run: make check

      - name: Resolve channel images
        id: image
        run: make -C deploy channel-plan CHANNELS="$CHANNELS"

      - name: Create shared kind cluster
        id: cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          wait: 120s

      - name: Deploy shared environment and all Helm testcases
        id: install
        run: |
          make -C deploy release \
            CHANNELS="$CHANNELS" \
            WORKLOAD_PROFILE="$WORKLOAD_PROFILE" \
            REUSE_CHANNEL_PLAN=true \
            PRELOAD_DEPENDENCY_IMAGES=false \
            RUNNER_IMAGE_PULL_POLICY=Always

      - name: Provision Grafana dashboards
        run: make observability-provision

      - name: Submit chaos workflows
        id: workflow
        run: |
          make -C deploy correctness \
            CHANNELS="$CHANNELS" \
            WORKLOAD_PROFILE="$WORKLOAD_PROFILE"

      - name: Run chaos workflows
        id: chaos
        run: |
          make -C deploy correctness-test \
            CHANNELS="$CHANNELS" \
            WORKLOAD_PROFILE="$WORKLOAD_PROFILE" \
            WORKFLOW_TIMEOUT_SECONDS="$WORKFLOW_TIMEOUT_SECONDS" \
            EXPECTED_CHAOS_INJECTIONS="$EXPECTED_CHAOS_INJECTIONS"

      - name: Publish chaos annotations
        if: always()
        run: |
          make -C deploy observability-annotations \
            CHANNELS="$CHANNELS" \
            RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Validate runner results
        id: test
        run: |
          make -C deploy test \
            CHANNELS="$CHANNELS" \
            RUNNER_TIMEOUT_SECONDS="$RUNNER_TIMEOUT_SECONDS"

      - name: Collect diagnostics
        if: always()
        run: make -C deploy diagnostics

      - name: Collect normalized status results
        if: ${{ always() && (github.event_name == 'schedule' || inputs.profile == 'five-cycle' || inputs.profile == 'status-smoke') }}
        run: |
          make -C deploy status-results \
            CHANNELS="$CHANNELS" \
            WORKLOAD_PROFILE="$WORKLOAD_PROFILE" \
            RUN_DATE="$(date -u +%F)" \
            RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            IMAGE_OUTCOME="${{ steps.image.outcome }}" \
            VERIFY_OUTCOME="${{ steps.verify.outcome }}" \
            CLUSTER_OUTCOME="${{ steps.cluster.outcome }}" \
            INSTALL_OUTCOME="${{ steps.install.outcome }}" \
            WORKFLOW_OUTCOME="${{ steps.workflow.outcome }}" \
            CHAOS_OUTCOME="${{ steps.chaos.outcome }}"

      - name: Upload normalized status results
        if: ${{ always() && (github.event_name == 'schedule' || inputs.profile == 'five-cycle' || inputs.profile == 'status-smoke') }}
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ inputs.profile == 'status-smoke' && 'smoke-' || '' }}result-all
          path: status-result/*.json
          if-no-files-found: error
          retention-days: 14
