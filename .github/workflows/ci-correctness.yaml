name: Correctness

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci-correctness.yaml"
      - "charts/**"
      - "deploy/**"
      - "runner-java/**"
      - "Makefile"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci-correctness.yaml"
      - "charts/**"
      - "deploy/**"
      - "runner-java/**"
      - "Makefile"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Correctness pipeline profile
        required: true
        type: choice
        default: quick
        options:
          - quick
          - five-cycle
      quick_duration:
        description: Workload duration for the quick profile only
        required: false
        type: choice
        default: 2m
        options:
          - 1m
          - 2m
          - 5m

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLUSTER_NAME: oxia-chaos
  KUBE_CONTEXT: kind-oxia-chaos
  NAMESPACE: oxia-chaos
  RELEASE_NAME: oxia-chaos
  RUNNER_IMAGE_REPOSITORY: oxia/chaos-java
  RUNNER_IMAGE_TAG: latest
  CORRECTNESS_PROFILE: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 'five-cycle' || 'quick' }}
  TEST_DURATION: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '6h' || inputs.quick_duration || '2m' }}
  KEY_COUNT: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '10000' || '1000' }}
  RATE: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '258' || '500' }}
  CHECKPOINT_INTERVAL: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '1m' || '30s' }}
  RUNNER_ACTIVE_DEADLINE_SECONDS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '23400' || '420' }}
  RUNNER_TIMEOUT_SECONDS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '23400' || '480' }}
  WORKFLOW_TIMEOUT_SECONDS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '21600' || '180' }}
  EXPECTED_CHAOS_INJECTIONS: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && '50' || '1' }}

jobs:
  basic-kv:
    name: Java basic-kv ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 'five-cycle pipeline' || 'quick pipeline' }}
    runs-on: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 'cncf-ubuntu-8-32-x86' || 'ubuntu-latest' }}
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.profile == 'five-cycle') && 420 || 25 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify runner and chart
        run: make check

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          wait: 120s

      - name: Preload Oxia and Chaos Mesh images
        run: make -C deploy dependency-images CLUSTER_NAME="$CLUSTER_NAME"

      - name: Install Oxia and Chaos Mesh
        run: |
          kubectl --context "$KUBE_CONTEXT" apply --filename deploy/namespaces.yaml
          helm upgrade --install "$RELEASE_NAME" charts/oxia-chaos \
            --kube-context "$KUBE_CONTEXT" \
            --namespace "$NAMESPACE" \
            --set runners.java.enabled=false \
            --set chaosWorkflow.enabled=false \
            --wait \
            --timeout 10m

      - name: Start correctness runner
        run: |
          helm upgrade --install "$RELEASE_NAME" charts/oxia-chaos \
            --kube-context "$KUBE_CONTEXT" \
            --namespace "$NAMESPACE" \
            --set runners.java.enabled=true \
            --set-string runners.java.image.repository="$RUNNER_IMAGE_REPOSITORY" \
            --set-string runners.java.image.tag="$RUNNER_IMAGE_TAG" \
            --set runners.java.image.pullPolicy=Always \
            --set chaosWorkflow.enabled=false \
            --set-string cases.basic-kv.duration="$TEST_DURATION" \
            --set cases.basic-kv.keyCount="$KEY_COUNT" \
            --set cases.basic-kv.rate="$RATE" \
            --set cases.basic-kv.batchSize=100 \
            --set-string cases.basic-kv.checkpointInterval="$CHECKPOINT_INTERVAL" \
            --set runnerJob.activeDeadlineSeconds="$RUNNER_ACTIVE_DEADLINE_SECONDS" \
            --wait \
            --timeout 5m
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" wait \
            --for=condition=Ready pod \
            --selector="app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=runner" \
            --timeout=3m

      - name: Start correctness workflow
        run: |
          make -C deploy correctness \
            KUBE_CONTEXT="$KUBE_CONTEXT" \
            NAMESPACE="$NAMESPACE" \
            RELEASE_NAME="$RELEASE_NAME" \
            CORRECTNESS_PROFILE="$CORRECTNESS_PROFILE"

      - name: Wait for correctness pipeline
        run: |
          make -C deploy correctness-test \
            KUBE_CONTEXT="$KUBE_CONTEXT" \
            NAMESPACE="$NAMESPACE" \
            RELEASE_NAME="$RELEASE_NAME" \
            WORKFLOW_TIMEOUT_SECONDS="$WORKFLOW_TIMEOUT_SECONDS" \
            EXPECTED_CHAOS_INJECTIONS="$EXPECTED_CHAOS_INJECTIONS"

      - name: Wait for runner result
        run: |
          make -C deploy test \
            KUBE_CONTEXT="$KUBE_CONTEXT" \
            NAMESPACE="$NAMESPACE" \
            RELEASE_NAME="$RELEASE_NAME" \
            RUNNER_TIMEOUT_SECONDS="$RUNNER_TIMEOUT_SECONDS" \
            RUNNER_POLL_INTERVAL=5

      - name: Collect cluster diagnostics
        if: always()
        run: |
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" get \
            pods,jobs,workflows,workflownodes,podchaos,networkchaos,stresschaos \
            --output=wide || true
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" get events \
            --sort-by=.lastTimestamp || true
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" logs \
            --selector=app.kubernetes.io/instance=oxia-chaos,app.kubernetes.io/component=runner \
            --all-containers=true --prefix=true --tail=500 || true
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" logs \
            --selector=chaos-mesh.org/workflow \
            --all-containers=true --prefix=true --tail=200 || true
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" logs \
            --selector=app.kubernetes.io/name=oxia-cluster,app.kubernetes.io/component=server \
            --all-containers=true --prefix=true --tail=200 || true
          kubectl --context "$KUBE_CONTEXT" --namespace "$NAMESPACE" describe \
            workflows,workflownodes || true
