nameOverride: ""
fullnameOverride: ""

# Identifies the Oxia server channel exercised by this chart release.
channel: stable

# Selects one configuration from each enabled testcase.
testProfile: five-cycle

# Deployment orchestration disables every runner while Oxia clusters converge.
runnerWorkloadsEnabled: true
runnerImagePullPolicyOverride: ""

# Leave empty to use the chart-managed Oxia service in the release namespace.
serviceAddress: ""

runners:
  java:
    enabled: true
    image:
      repository: oxia/chaos-java
      tag: latest
      pullPolicy: Always
    env: []
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi

cases:
  basic-kv:
    enabled: true
    profiles:
      quick:
        duration: 1m
        keyCount: 1000
        rate: 500
        batchSize: 100
        checkpointInterval: 30s
      five-cycle:
        duration: 6h
        keyCount: 10000
        rate: 258
        batchSize: 100
        checkpointInterval: 1m

chaosWorkflow:
  enabled: false
  # Supported profiles: quick, five-cycle.
  profile: five-cycle
  # Local deploy randomly overrides this for each submitted workflow.
  victimOrdinal: 0

runnerJob:
  imagePullSecrets: []
  annotations: {}
  labels: {}
  activeDeadlineSeconds: 25200
  metrics:
    enabled: true
    port: 9464
    path: /metrics
  telemetry:
    enabled: false
    otlpEndpoint: ""
    clusterName: oxia-chaos
  nodeSelector: {}
  tolerations: []
  affinity: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

observability:
  enabled: false
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.153.0
    pullPolicy: IfNotPresent
  existingSecret: ""
  clusterName: oxia-chaos
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  traces:
    successSamplingPercentage: 0.5

oxia-cluster:
  enabled: true
  # Add oc-<runner>-<case> for every enabled pair.
  namespaces:
    - name: oc-java-basic-kv
      initialShardCount: 1
      replicationFactor: 3
  image:
    repository: oxia/oxia
    tag: 0.16.8
    pullPolicy: IfNotPresent
  server:
    replicas: 3
    cpu: 250m
    memory: 512Mi
    storage: 1Gi
    config:
      storage:
        database:
          readCacheSizeMB: 64

chaos-mesh:
  enabled: true
  controllerManager:
    leaderElection:
      enabled: false
  chaosDaemon:
    runtime: containerd
    socketPath: /run/containerd/containerd.sock
  dashboard:
    create: false
