apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "oxia-chaos.fullname" . }}-runner
  labels:
    {{- include "oxia-chaos.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: oxia-chaos
    oxia.chaos/runner: {{ required "runner.implementation is required; use a values-<language>.yaml file" .Values.runner.implementation | quote }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.runner.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "oxia-chaos.labels" . | nindent 8 }}
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: oxia-chaos
        oxia.chaos/runner: {{ .Values.runner.implementation | quote }}
        {{- with .Values.runner.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.runner.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "oxia-chaos.serviceAccountName" . }}
      {{- with .Values.runner.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: "{{ required "runner.image.repository is required; use a values-<language>.yaml file" .Values.runner.image.repository }}:{{ .Values.runner.image.tag }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy }}
          {{- with .Values.runner.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.runner.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.runner.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
      {{- with .Values.runner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
